name: PrimeEstate SaaS CI — PROD

on:
  push:
    branches: [main]
  # Redeploy the current main by hand, e.g. after changing the server's .env.
  workflow_dispatch:

# One run at a time. A second push waits for the first rather than building
# over it, and never cancels a deploy halfway through a reload.
concurrency:
  group: prod-main
  cancel-in-progress: false

jobs:
  check:
    runs-on: estate-management-app-prod

    # Build-time only. No database connection is made: `next build` renders
    # every route as dynamic, and the Mongo connection is opened lazily on the
    # first request.
    #
    # The config loader (src/core/config/schema.ts) validates the whole
    # environment with Zod at module load, so the build fails outright on a
    # missing or malformed variable rather than at request time. That is why
    # placeholders are needed at all, and why the secrets below are real
    # 64-character hex: the loader rejects anything shorter, and
    # JWT_REFRESH_SECRET must differ from JWT_ACCESS_SECRET, otherwise a leaked
    # access key could mint long-lived sessions.
    #
    # These are throwaway CI values. Production secrets come from
    # `pnpm keys:generate` and never appear in a workflow file.
    env:
      APP_URL: "http://localhost:3800"
      APP_NAME: "PrimeEstate"
      MONGODB_URI: "mongodb://127.0.0.1:27017/ci"
      JWT_ACCESS_SECRET: "1111111111111111111111111111111111111111111111111111111111111111"
      JWT_REFRESH_SECRET: "2222222222222222222222222222222222222222222222222222222222222222"
      ENCRYPTION_KEY: "3333333333333333333333333333333333333333333333333333333333333333"
      ENCRYPTION_BLIND_INDEX_KEY: "4444444444444444444444444444444444444444444444444444444444444444"
      QR_SIGNING_SECRET: "5555555555555555555555555555555555555555555555555555555555555555"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # pnpm must exist before setup-node, because `cache: pnpm` resolves the
      # store path by running pnpm. The other order fails on a clean runner.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Unit and integration tests run against mongodb-memory-server, so they
      # need no service container. This is where tenant isolation is proved:
      # every module asserts that estate A cannot read or write estate B.
      - name: Test
        run: pnpm test

      # `pnpm build` also runs the navigation coverage and bundle budget
      # checks, so a nav link pointing at a screen that does not exist, or a
      # route that outgrows its budget, fails here.
      - name: Build
        run: pnpm build

  # Runs on the production host itself, through its self-hosted runner, and only
  # once every check above has passed.
  #
  # It deploys into the app's own directory (repository variable APP_DIR), not
  # the runner's workspace: that directory holds the real .env and .env.local,
  # which are never in git, and the PM2 processes point at it. The runner must
  # run as the same user that owns those PM2 processes.
  deploy:
    needs: check
    runs-on: estate-management-app-prod
    environment: production
    permissions:
      contents: read

    env:
      APP_DIR: ${{ vars.APP_DIR }}

    steps:
      - name: Check the deploy target
        run: |
          if [ -z "$APP_DIR" ]; then
            echo "::error::Set the APP_DIR repository variable to the app's directory on the server."
            exit 1
          fi
          test -d "$APP_DIR/.git" || { echo "::error::$APP_DIR is not a git checkout."; exit 1; }
          command -v pm2 >/dev/null || { echo "::error::pm2 is not on the runner's PATH."; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

            # Fast-forward only: if someone edited tracked files on the server, stop
      # and say so rather than overwrite them. Untracked files — the env files,
      # logs/ — are untouched either way. The repository is private, so the
      # fetch borrows this run's token for that one command; nothing is stored.
      - name: Update the code
        working-directory: ${{ env.APP_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --prune origin main
          git merge --ff-only "$GITHUB_SHA"


      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: pnpm install --frozen-lockfile

      # copy env
      - name: Copy environment files
        working-directory: ${{ env.APP_DIR }}
        run: cp ../.env.template .env

      # Built here, against the server's real environment, rather than copied
      # from the check job: the config loader validates it at build time.
      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: pnpm build

      - name: Sync database indexes
        working-directory: ${{ env.APP_DIR }}
        run: pnpm db:indexes

      # `startOrReload` starts anything not yet running and gracefully reloads
      # the rest; `--update-env` picks up changes made to the ecosystem file.
      - name: Reload PM2
        working-directory: ${{ env.APP_DIR }}
        run: |
          mkdir -p logs
          pm2 startOrReload ecosystem.config.cjs --env production --update-env
          pm2 save

      # Fail the deploy, loudly, if the server does not come back up.
      - name: Health check
        working-directory: ${{ env.APP_DIR }}
        run: |
          port=$(grep -hE '^PORT=' .env.local .env 2>/dev/null | head -1 | cut -d= -f2)
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${port:-3000}/api/health" >/dev/null; then
              echo "Healthy after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The app did not answer /api/health within 60 seconds."
          pm2 logs estate-web --lines 50 --nostream
          exit 1
